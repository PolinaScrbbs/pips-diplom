{% load static %}
<div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 28px; overflow: hidden;">
            <div class="modal-header border-0 bg-white pt-4 px-4 pb-2">
                <div>
                    <h4 class="fw-bold text-dark mb-1">Записаться на приём</h4>
                    <p class="small text-muted mb-0">Заполните данные для консультации</p>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
                <form id="bookingForm" method="post" action="{% url 'booking:create_booking' %}" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.path }}">

                    <div class="form-floating mb-3">
                        <input type="text" name="child_name" class="form-control custom-input" id="id_child_name"
                               placeholder="Имя ребенка" required
                               value="{% if last_booking %}{{ last_booking.child_name }}{% endif %}">
                        <label for="id_child_name"><i class="bi bi-person me-2"></i>Имя ребенка</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" name="parent_name" class="form-control custom-input" id="id_parent_name"
                               placeholder="Ваше имя" required
                               value="{% if last_booking %}{{ last_booking.parent_name }}{% endif %}">
                        <label for="id_parent_name"><i class="bi bi-person-check me-2"></i>Ваше имя</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="tel" name="phone" class="form-control custom-input" id="id_phone"
                               placeholder="Телефон" required
                               value="{% if user.is_authenticated %}{{ last_booking.phone|default:user.phone|default:'' }}{% endif %}">
                        <label for="id_phone"><i class="bi bi-telephone me-2"></i>Номер телефона</label>
                    </div>
                    <div class="form-floating mb-4">
                        <select name="service" class="form-select custom-input" id="id_service" required>
                            <option value="" selected disabled>Выберите направление...</option>
                            {% for service in services %}
                                <option value="{{ service.id }}">{{ service.name }} — {{ service.price }} ₽</option>
                            {% endfor %}
                        </select>
                        <label for="id_service"><i class="bi bi-briefcase me-2"></i>Услуга</label>
                    </div>

                    <button type="submit" id="bookingSubmitBtn" class="btn btn-sage w-100 py-3 rounded-pill fw-bold shadow-sm">
                        Подтвердить запись <i class="bi bi-arrow-right-short ms-1"></i>
                    </button>
                </form>

                <div id="bookingSuccess" class="text-center py-4 d-none">
                    <div class="mb-3 animate__animated animate__zoomIn">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h4 class="fw-bold">Успешно!</h4>
                    <p class="text-muted">Мы скоро свяжемся с вами для подтверждения.</p>
                    <button type="button" class="btn btn-outline-success rounded-pill px-4" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>
</div>
