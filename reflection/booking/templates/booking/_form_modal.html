<div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-success" id="bookingModalLabel">Записаться на консультацию</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="bookingForm" method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.path }}">
          
          {# Этот цикл выведет ВСЕ поля из вашей формы, включая новый селектор услуг #}
          {% for field in booking_form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small">{{ field.errors.as_text }}</div>
              {% endif %}
            </div>
          {% endfor %}

          <button type="submit" class="btn btn-success w-100 mt-3">Отправить заявку</button>
        </form>
      </div>
    </div>
  </div>
</div>
